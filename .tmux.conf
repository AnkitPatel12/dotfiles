# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and - (much more intuitive than " and %)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes with Ctrl+h/j/k/l (same as your nvim window keys)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Start window numbers at 1 (easier to reach than 0)
set -g base-index 1
set -g pane-base-index 1

# True color support (needed for catppuccin to look right)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 10000

# Mouse support (click to switch panes)
set -g mouse on
